# ─────────────────────────────────────────────────────────────────────────────
# WindNerd Node — Wind speed and direction sensor
#
# Board: Generic ESP32-C3 (definitions/boards/generic-esp32c3/manifest.yaml)
#
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  name: windnerd-node
  friendly_name: WindNerd Node

  # ── Calibration ─────────────────────────────────────────────────────────
  # Anemometer transfer function: 1.31 m/s per Hz.
  # pulses/min ÷ 60 → Hz, × 1.31 → m/s  ⇒  1.31 / 60 = 0.0218333
  speed_factor: "0.0218333"
  # Degrees added to the raw magnet angle so that 0° = true north.
  # Adjust after mounting the vane.
  direction_offset: "0.0"

  # ── Diagnostic LED ──────────────────────────────────────────────────────
  # Half-width of the "vane points north" window, in degrees.
  north_window: "15.0"
  # Length of the flash emitted on each anemometer pulse, in milliseconds.
  pulse_flash_ms: "40"
  # How long the LED stays lit at power-up, in milliseconds.
  boot_flash_ms: "2000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "windnerd.node"
    version: "1.0.0"

  # Alive indicator: the LED is lit for the first ${boot_flash_ms} ms, so
  # plugging the board in shows something straight away.
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            id(led_flash_until) = millis() + ${boot_flash_ms};
            id(led_output).set_level(1.0f);
    
esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    
    
logger:

# Shipped without a key: the first connection is unencrypted
api:
  encryption:

ota:
  - platform: esphome

dashboard_import:
  package_import_url: github://windnerd-labs/WindNerd-Node/example/esphome/factory.yaml@main
  import_full_config: true

wifi:
  ap:
    ssid: ${friendly_name} Hotspot

captive_portal:

external_components:
  - source: github://windnerd-labs/WindNerd-Node@main
    components: [ tmag5273 ]

# ESP32-C3 has a single I2C controller
i2c:
  id: bus_a
  sda: GPIO1
  scl: GPIO2
  frequency: 100kHz

# Wind vane angle sensor.
tmag5273:
  id: vane_tmag5273
  axis: XZ

# ── Diagnostic LED ────────────────────────────────────────────────────────
#   at power-up = lit for ${boot_flash_ms} ms, the firmware is alive
#   solid on    = vane within ±${north_window}° of north, for aligning the vane
#   flash       = one anemometer pulse, ${pulse_flash_ms} ms long, no averaging
output:
  - platform: ledc
    pin: GPIO20
    id: led_output

globals:
  # millis() deadline until which a pulse flash owns the LED.
  - id: led_flash_until
    type: uint32_t
    initial_value: "0"

# Raw anemometer contact, used only to flash the LED — on_press is the same
# rising edge the pulse_counter below counts, and bounce just extends a flash.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO7
      allow_other_uses: true
    id: wind_pulse
    internal: true
    on_press:
      - lambda: |-
          // Light up now; the interval below restores the idle state after.
          id(led_flash_until) = millis() + ${pulse_flash_ms};
          id(led_output).set_level(1.0f);

interval:
  - interval: 20ms
    then:
      - lambda: |-
          // A pulse flash owns the LED until its window expires.
          if ((int32_t)(millis() - id(led_flash_until)) < 0)
            return;
          const float dir = isnan(id(wind_direction_inst).state) ? 0.0f : id(wind_direction_inst).state;
          // Angular distance from north, 0..180, with no jump at the 360°→0° wrap.
          const float off_north = fabsf(fmodf(dir + 180.0f, 360.0f) - 180.0f);
          id(led_output).set_level(off_north <= ${north_window} ? 1.0f : 0.0f);

sensor:
  # ── Wind speed, sampled every 3 s ───────────────────────────────────────
  # 3 s is the WMO-standard sampling basis for gusts, and 200 samples make
  # the 10-minute windows below.

  - platform: pulse_counter
    name: Wind Speed
    id: wind_speed
    # Shared with the wind_pulse binary_sensor that flashes the diagnostic LED.
    pin:
      number: GPIO7
      allow_other_uses: true
    update_interval: 3s
    unit_of_measurement: m/s
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:weather-windy
    filters:
      - multiply: ${speed_factor}

  # ── 10-minute wind speed statistics, published every 30 s ───────────────

  - platform: copy
    source_id: wind_speed
    name: Wind Speed 10min Avg
    id: wind_speed_avg
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 200
          send_every: 10
          send_first_at: 1

  - platform: copy
    source_id: wind_speed
    name: Wind Gust 10min
    id: wind_gust
    accuracy_decimals: 2
    icon: mdi:weather-windy-variant
    filters:
      - max:
          window_size: 200
          send_every: 10
          send_first_at: 1

  # ── Wind direction ──────────────────────────────────────────────────────
  # Vane sampled at 5 Hz. Angles cannot be averaged arithmetically (359° and
  # 1° would give 180°), so sin/cos are averaged and recombined with atan2:
  #   stage 1 → 3 s tumbling mean (live)   stage 2 → 200 blocks (10 min avg)

  - platform: tmag5273
    tmag5273_id: vane_tmag5273
    id: wind_direction_raw
    internal: true
    update_interval: 200ms

  # North-aligned instantaneous angle; also drives the diagnostic LED.
  - platform: copy
    source_id: wind_direction_raw
    id: wind_direction_inst
    internal: true
    filters:
      - lambda: return fmodf(x + ${direction_offset} + 360.0f, 360.0f);

  # Stage 1: 3 s tumbling means of the vector components (15 × 200 ms).
  - platform: copy
    source_id: wind_direction_inst
    id: wind_direction_sin_3s
    internal: true
    filters:
      - lambda: return sinf(x * M_PI / 180.0f);
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15
          send_first_at: 1

  - platform: copy
    source_id: wind_direction_inst
    id: wind_direction_cos_3s
    internal: true
    filters:
      - lambda: return cosf(x * M_PI / 180.0f);
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15
          send_first_at: 1

  - platform: template
    name: Wind Direction
    id: wind_direction
    unit_of_measurement: °
    device_class: wind_direction
    state_class: measurement_angle
    icon: mdi:compass
    accuracy_decimals: 0
    update_interval: 3s
    lambda: |-
      const float s = id(wind_direction_sin_3s).state;
      const float c = id(wind_direction_cos_3s).state;
      if (isnan(s) || isnan(c))
        return NAN;
      return fmodf(atan2f(s, c) * 180.0f / M_PI + 360.0f, 360.0f);

  # Stage 2: sliding 10-minute window over the 3 s blocks (200 × 3 s),
  # published every 30 s.
  - platform: copy
    source_id: wind_direction_sin_3s
    id: wind_direction_sin_10min
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 200
          send_every: 10
          send_first_at: 1

  - platform: copy
    source_id: wind_direction_cos_3s
    id: wind_direction_cos_10min
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 200
          send_every: 10
          send_first_at: 1

  - platform: template
    name: Wind Direction 10min Avg
    id: wind_direction_avg
    unit_of_measurement: °
    device_class: wind_direction
    state_class: measurement_angle
    icon: mdi:compass
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float s = id(wind_direction_sin_10min).state;
      const float c = id(wind_direction_cos_10min).state;
      if (isnan(s) || isnan(c))
        return NAN;
      return fmodf(atan2f(s, c) * 180.0f / M_PI + 360.0f, 360.0f);
