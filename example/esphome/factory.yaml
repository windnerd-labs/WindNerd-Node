# ─────────────────────────────────────────────────────────────────────────────
# WindNerd Node — Wind speed and direction sensor
#
# Board: Generic ESP32-C3 (definitions/boards/generic-esp32c3/manifest.yaml)
#
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  name: windnerd-node
  friendly_name: WindNerd Node

  # ── Calibration ─────────────────────────────────────────────────────────
  # Anemometer transfer function: 1.31 m/s per Hz.
  # pulses/min ÷ 60 → Hz, × 1.31 → m/s  ⇒  1.31 / 60 = 0.0218333
  speed_factor: "0.0218333"
  # Degrees added to the raw magnet angle so that 0° = true north.
  # Adjust after mounting the vane.
  direction_offset: "0.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "windnerd.node"
    version: "1.0.0"
    
esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    
    
logger:

# Shipped without a key: the first connection is unencrypted
api:
  encryption:

ota:
  - platform: esphome

dashboard_import:
  package_import_url: github://windnerd-labs/WindNerd-Node/example/esphome/factory.yaml@main
  import_full_config: true

wifi:
  ap:
    ssid: ${friendly_name} Hotspot

captive_portal:

external_components:
  - source: github://windnerd-labs/WindNerd-Node@main
    components: [ tmag5273 ]

# ESP32-C3 has a single I2C controller
i2c:
  id: bus_a
  sda: GPIO1
  scl: GPIO2
  frequency: 100kHz

# Wind vane angle sensor.
tmag5273:
  id: vane_tmag5273
  axis: XZ

# ── Diagnostic LED ────────────────────────────────────────────────────────
#   blink rate  = wind speed      (solid at 0 m/s, 1 Hz per m/s, capped 5 Hz)
#   brightness  = vane direction  (off at 0°/north → 100 % at 180°/south,
#                                  symmetric, no jump at the 360°→0° wrap)
# Spin the cups → LED blinks faster (reacts within ~3 s). Rotate the vane →
# LED dims/brightens (reacts within ~200 ms, straight from the 5 Hz samples).
# Note the LED is dark when the vane points north — point it south for a
# power-up check.
output:
  - platform: ledc
    pin: GPIO20
    id: led_output

globals:
  - id: led_blink_phase
    type: float
    initial_value: "0.0"

interval:
  - interval: 50ms
    then:
      - lambda: |-
          const float speed = isnan(id(wind_speed).state) ? 0.0f : id(wind_speed).state;
          const float dir = isnan(id(wind_direction_inst).state) ? 0.0f : id(wind_direction_inst).state;
          // Blink frequency: 1 Hz per m/s, capped at 5 Hz (period 200 ms,
          // still clean with this 50 ms tick).
          const float freq = std::min(speed, 5.0f);
          id(led_blink_phase) += freq * 0.05f;
          if (id(led_blink_phase) >= 1.0f)
            id(led_blink_phase) -= 1.0f;
          const bool lit = (freq < 0.05f) || (id(led_blink_phase) < 0.5f);
          // Angular distance from north, scaled to 0..1 (0° → 0, 180° → 1).
          const float level = 1.0f - fabsf(dir - 180.0f) / 180.0f;
          id(led_output).set_level(lit ? level : 0.0f);

sensor:
  # ── Wind speed, sampled every 3 s ───────────────────────────────────────
  # 3 s is the WMO-standard sampling basis for gusts, and 200 samples make
  # the 10-minute windows below.

  - platform: pulse_counter
    name: Wind Speed
    id: wind_speed
    pin: GPIO7
    update_interval: 3s
    unit_of_measurement: m/s
    device_class: wind_speed
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:weather-windy
    filters:
      - multiply: ${speed_factor}
      -

  # ── 10-minute wind speed statistics, published every 30 s ───────────────

  - platform: copy
    source_id: wind_speed
    name: Wind Speed 10min Avg
    id: wind_speed_avg
    accuracy_decimals: 2
    filters:
      - sliding_window_moving_average:
          window_size: 200
          send_every: 10
          send_first_at: 1

  - platform: copy
    source_id: wind_speed
    name: Wind Gust 10min
    id: wind_gust
    accuracy_decimals: 2
    icon: mdi:weather-windy-variant
    filters:
      - max:
          window_size: 200
          send_every: 10
          send_first_at: 1

  # ── Wind direction ──────────────────────────────────────────────────────
  # The vane is sampled at 5 Hz (200 ms) for accuracy. Angles cannot be
  # averaged arithmetically (359° and 1° would give 180° instead of 0°), so
  # the unit-vector components sin/cos are averaged and recombined with
  # atan2 — the standard vector mean for wind direction — in two stages:
  #   stage 1: 3 s tumbling mean of the 5 Hz samples  → live reading
  #   stage 2: sliding mean of 200 stage-1 blocks     → 10 min average

  - platform: tmag5273
    tmag5273_id: vane_tmag5273
    id: wind_direction_raw
    internal: true
    update_interval: 200ms

  # North-aligned instantaneous angle; also drives the diagnostic LED.
  - platform: copy
    source_id: wind_direction_raw
    id: wind_direction_inst
    internal: true
    filters:
      - lambda: return fmodf(x + ${direction_offset} + 360.0f, 360.0f);

  # Stage 1: 3 s tumbling means of the vector components (15 × 200 ms).
  - platform: copy
    source_id: wind_direction_inst
    id: wind_direction_sin_3s
    internal: true
    filters:
      - lambda: return sinf(x * M_PI / 180.0f);
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15
          send_first_at: 1

  - platform: copy
    source_id: wind_direction_inst
    id: wind_direction_cos_3s
    internal: true
    filters:
      - lambda: return cosf(x * M_PI / 180.0f);
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15
          send_first_at: 1

  - platform: template
    name: Wind Direction
    id: wind_direction
    unit_of_measurement: °
    device_class: wind_direction
    state_class: measurement_angle
    icon: mdi:compass
    accuracy_decimals: 0
    update_interval: 3s
    lambda: |-
      const float s = id(wind_direction_sin_3s).state;
      const float c = id(wind_direction_cos_3s).state;
      if (isnan(s) || isnan(c))
        return NAN;
      return fmodf(atan2f(s, c) * 180.0f / M_PI + 360.0f, 360.0f);

  # Stage 2: sliding 10-minute window over the 3 s blocks (200 × 3 s),
  # published every 30 s.
  - platform: copy
    source_id: wind_direction_sin_3s
    id: wind_direction_sin_10min
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 200
          send_every: 10
          send_first_at: 1

  - platform: copy
    source_id: wind_direction_cos_3s
    id: wind_direction_cos_10min
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 200
          send_every: 10
          send_first_at: 1

  - platform: template
    name: Wind Direction 10min Avg
    id: wind_direction_avg
    unit_of_measurement: °
    device_class: wind_direction
    state_class: measurement_angle
    icon: mdi:compass
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float s = id(wind_direction_sin_10min).state;
      const float c = id(wind_direction_cos_10min).state;
      if (isnan(s) || isnan(c))
        return NAN;
      return fmodf(atan2f(s, c) * 180.0f / M_PI + 360.0f, 360.0f);
