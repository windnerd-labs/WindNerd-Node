<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="633"
   height="446"
   viewBox="0 0 880 620"
   role="img"
   aria-label="Schematic of the circuitry between J1 and the ESP32-C3. Pin 1 goes to ground. Pin 2 taps the 3.3 volt rail. Pins 3, 4 and 5 each have a 5.1 kilohm pull-up to 3.3 volts and a 100 ohm series resistor before reaching GPIO2, GPIO1 and GPIO0. The TMAG5273 wind vane sensor shares the I2C bus. The SIG line also feeds a 69 hertz RC low-pass filter into GPIO4."
   version="1.1"
   id="svg206"
   sodipodi:docname="fig3-j1-interface-circuit.svg"
   inkscape:version="1.2.2 (b0a8486541, 2022-12-01)"
